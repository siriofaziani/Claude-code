function migrate(st){
  if (!st.pillsDone || typeof st.pillsDone !== 'object') st.pillsDone = {};
  if (!Array.isArray(st.learnLabels)) st.learnLabels = [];
  Object.values(st.days || {}).forEach(d => {
    if (!d) return;
    if (!Array.isArray(d.learnItems)) d.learnItems = [];
    const t = (d.learned || '').trim();
    if (t && !d.learnItems.length) d.learnItems.push({id:uid(), type:'manual', sector:'altro', label:'Non classificato', title:learnTitle(t), text:t, at:0, legacy:true});
    if (t) d.learned = '';
  });
  return st;
}

const blankDay = () => ({studySec:0, home:{acts:[], note:''}, social:null, km:null, films:[], learned:'', learnItems:[], learnDraft:'', skin:false, sleep:null, bed:'', wake:'', water:null});
function getDay(k, create=false){
  let d = S.days[k];
  if (!d){ d = blankDay(); if (create) S.days[k] = d; }
  if (!d.home) d.home = {acts:[], note:''};
  if (!d.films) d.films = [];
  if (!Array.isArray(d.learnItems)) d.learnItems = [];
  return d;
}
const tracked = k => k >= S.createdAt && k <= todayKey();
function studySecs(k){
  const d = S.days[k]; let s = d ? (d.studySec||0) : 0;
  if (S.timer && S.timer.day === k) s += (Date.now() - S.timer.start)/1000;
  return s;
}
function hasFilm(k){ const d = S.days[k]; return !!(d && d.films && d.films.length); }
function cinemaInfo(k){
  for (let i=0; i<3; i++){
    const kk = addDays(k, -i);
    if (hasFilm(kk)) return {covered:true, last:kk, left:2-i, today:i===0};
  }
  let last = null;
  for (let i=3; i<120; i++){ const kk = addDays(k,-i); if (kk < S.createdAt) break; if (hasFilm(kk)){ last = kk; break; } }
  return {covered:false, last, left:-1, today:false};
}
function status(k){
  const d = S.days[k] || blankDay();
  const soc = d.social;
  return {
    study: studySecs(k) >= STUDY_GOAL,
    home: (d.home?.acts?.length||0) > 0,
    social: soc !== null && soc !== '' && soc !== undefined && +soc < SOCIAL_LIMIT,
    run: (+d.km||0) >= RUN_GOAL,
    cinema: cinemaInfo(k).covered,
    learn: (d.learnItems||[]).length > 0 || (d.learned||'').trim().length >= 3,
    skin: !!d.skin,
    ...(k >= (S.sleepSince || S.createdAt) ? {sleep: (+d.sleep||0) >= SLEEP_GOAL} : {}),
    ...(k >= (S.waterSince || S.createdAt) ? {water: (+d.water||0) >= WATER_GOAL} : {}),
  };
}
// Le task introdotte dopo (es. il sonno) contano solo dal giorno in cui sono state aggiunte
const habitsFor = k => HABITS.filter(h => !h.since || k >= (S[h.since] || S.createdAt));
const total = k => habitsFor(k).length;
const score = k => Object.values(status(k)).filter(Boolean).length;
const ratio = k => score(k) / total(k);
const winNeed = k => total(k) - WIN_MISS;
const isWin = k => score(k) >= winNeed(k);
const isPerfect = k => score(k) === total(k);
function sleepFromTimes(bed, wake){
  if (!/^\d{2}:\d{2}$/.test(bed||'') || !/^\d{2}:\d{2}$/.test(wake||'')) return null;
  const m = t => +t.slice(0,2)*60 + +t.slice(3,5);
  let d = m(wake) - m(bed); if (d <= 0) d += 1440;
  return Math.round(d/60*4)/4;
}

function chromeOf(id, k){
  const d = S.days[k] || blankDay();
  switch(id){
    case 'study': {
      const s = studySecs(k), done = s >= STUDY_GOAL;
      return {done, pct:Math.min(1,s/STUDY_GOAL), state: done?'done':s>0?'progress':'todo',
        meta: done ? `Obiettivo superato di ${fmtDur(s-STUDY_GOAL)}` : `Mancano ${fmtDur(STUDY_GOAL-s)}`, mini: `${fmtDur(s)} / 2h`};
    }
    case 'home': {
      const n = d.home.acts.length;
      return {done:n>0, pct:n?1:0, state:n?'done':'todo', meta: n ? `${plural(n,'attività','attività')} registrate` : 'Seleziona almeno un\'attività', mini: n ? d.home.acts[0] + (n>1?` +${n-1}`:'') : 'Nessuna'};
    }
    case 'social': {
      const v = d.social;
      if (v === null || v === '' || v === undefined) return {done:false, pct:0, state:'todo', meta:'Inserisci i minuti di oggi', mini:'Da registrare'};
      const n = +v, over = n >= SOCIAL_LIMIT;
      return {done:!over, pct:Math.min(1,n/SOCIAL_LIMIT), state: over?'over':'done', bar: over?'over':'done',
        meta: over ? `Limite superato di ${n-SOCIAL_LIMIT+ (n===SOCIAL_LIMIT?0:0)} min` : `Margine residuo: ${SOCIAL_LIMIT-n} min`, mini:`${n} min`};
    }
    case 'run': {
      const km = +d.km || 0, done = km >= RUN_GOAL;
      return {done, pct:Math.min(1,km/RUN_GOAL), state: done?'done':km>0?'progress':'todo',

    }

      else { meta = ci.last ? `Ultimo film ${relDays(diffDays(k, ci.last))}: è ora di guardarne uno` : 'Nessun film negli ultimi 3 giorni'; mini = 'Film da vedere'; }
      return {done:ci.covered, pct: ci.covered ? 1 : 0, state: ci.covered?'done':'todo', meta, mini};
    }

      const items = d.learnItems || [], n = items.length, legacy = (d.learned||'').trim().length >= 3, done = n > 0 || legacy;
      return {done, pct:done?1:0, state:done?'done':'todo',

    }
    case 'sleep': {
      const v = d.sleep;
      if (v === null || v === '' || v === undefined) return {done:false, pct:0, state:'todo', meta:'Inserisci le ore dormite stanotte', mini:'Da registrare'};
      const h = +v, done = h >= SLEEP_GOAL;
      return {done, pct:Math.min(1, h/SLEEP_GOAL), state: done ? 'done' : 'progress',
        meta: done ? (h > SLEEP_GOAL ? `Recupero completo: +${fmtDur((h-SLEEP_GOAL)*3600)} oltre le 8 ore` : 'Obiettivo centrato: 8 ore') : `Sotto obiettivo di ${fmtDur((SLEEP_GOAL-h)*3600)}`,
        mini: `${fmtDur(h*3600)} / 8h`};
    }
    case 'water': return waterChrome(d);

function streakAt(k){ let n = 0; while (k >= S.createdAt && isWin(k)){ n++; k = addDays(k,-1); } return n; }
function currentStreak(){ const t = todayKey(); return isWin(t) ? streakAt(t) : streakAt(addDays(t,-1)); }
function bestStreak(){ let best = 0, cur = 0; for (const k of range(S.createdAt, todayKey())){ if (isWin(k)){ cur++; best = Math.max(best,cur); } else cur = 0; } return best; }

const monthlyCost = s => s.period === 'anno' ? s.price/12 : s.price;

function rollSubs(){
  const t = todayKey(); let ch = false;
  for (const s of S.subs){
    if (!s.auto) continue;
    let guard = 0;
    while (s.renewal < t && guard++ < 240){ s.renewal = addMonths(s.renewal, s.period==='anno'?12:1, s.anchor); ch = true; }
  }
  if (ch) save();
}
function syncSalary(){
  const amt = +S.salary.amount; if (!(amt > 0)) return 0;
  const t = todayKey(); let [y, m] = S.salary.since.split('-').map(Number); m -= 1;
  const now = parse(t); let added = 0, guard = 0;
  while (new Date(y, m, 1) <= now && guard++ < 600){
    const last = lastDayKey(y, m), mk = last.slice(0,7);
    if (last <= t && !(S.salary.skipped||[]).includes(mk) && !S.incomes.some(i => i.type==='stipendio' && i.auto && i.month===mk)){
      S.incomes.push({id:uid(), type:'stipendio', auto:true, month:mk, amount:amt, date:last, label:'Stipendio fisso', note:'Accredito automatico di fine mese'});
      added++;
    }
    m++; if (m > 11){ m = 0; y++; }
  }
  if (added) save();
  return added;
}
const incomeIn = (a, b) => sum(S.incomes.filter(i => i.date >= a && i.date <= b).map(i => i.amount));
function monthBounds(offset=0){ const n = new Date(); const y = n.getFullYear(), m = n.getMonth()+offset; return [ymd(new Date(y,m,1)), ymd(new Date(y,m+1,0))]; }
function subsCostForMonth(mk){ const end = ymd(new Date(+mk.slice(0,4), +mk.slice(5,7), 0)); return sum(S.subs.filter(s => (s.since||S.createdAt) <= end).map(monthlyCost)); }

let ringN = 0;
function ring(pct, size=160, stroke=10, center=''){
  const r = (size-stroke)/2, c = 2*Math.PI*r, off = c*(1-clamp(pct,0,1)), id = 'rg'+(ringN++), full = pct >= 1;
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 ${size} ${size}">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:${full?'var(--em-2)':'var(--gold-2)'}"/><stop offset="1" style="stop-color:${full?'var(--em-3)':'var(--gold-3)'}"/></linearGradient></defs>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r - stroke/2 - 5}" fill="none" stroke="rgba(255,255,255,.04)" stroke-width="1" stroke-dasharray="1.5 5"/>
    <circle class="ring-val" style="--c:${c}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#${id})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg><div class="ring-center"><div>${center}</div></div></div>`;
}
function toast(msg, o={}){
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast ' + (o.tone||'');
  el.innerHTML = `${icon(o.icon || (o.tone==='em'?'check':'bell'))}<span>${msg}</span>${o.action?`<button class="btn btn-sm btn-outline-gold">${esc(o.action.label)}</button>`:''}`;
  box.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(()=>el.remove(), 300); };
  if (o.action) $('button', el).onclick = () => { o.action.fn(); kill(); };
  setTimeout(kill, o.ms || (o.action ? 9000 : 3600));
}

const charts = {};
function destroyCharts(){ Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function mkChart(id, cfg){
  const el = document.getElementById(id); if (!el) return;
  if (!window.Chart){ el.parentElement.insertAdjacentHTML('beforeend','<div class="chart-empty">Grafici non disponibili: serve una connessione per caricare Chart.js.</div>'); return; }
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart(el, cfg);
}
function pal(){
  const cs = getComputedStyle(document.documentElement), g = n => cs.getPropertyValue(n).trim();
  return {a:g('--gold'), a2:g('--gold-2'), aRgb:g('--a-rgb'), s:g('--em'), s2:g('--em-2'), sRgb:g('--s-rgb'), sky:g('--sky'), skyRgb:g('--sky-rgb'),
    ruby:g('--ruby'), rRgb:g('--r-rgb'), text:g('--text'), text2:g('--text-2'), muted:g('--muted'), tip:g('--toast-bg')};
}
const rg = (rgb, a) => `rgba(${rgb},${a})`;
function chartDefaults(){
  if (!window.Chart) return;
  const C = Chart.defaults, P = pal();
  C.font.family = "Inter, system-ui, sans-serif"; C.font.size = 11.5; C.color = P.muted;
  C.borderColor = 'rgba(255,255,255,.05)';
  C.plugins.legend.display = false;
  Object.assign(C.plugins.tooltip, {backgroundColor:P.tip, borderColor:rg(P.aRgb,.35), borderWidth:1, titleColor:P.text, bodyColor:P.text2, padding:12, cornerRadius:10, displayColors:true, boxPadding:4, titleFont:{weight:'600'}});
  C.maintainAspectRatio = false;
  C.animation.duration = 700;
  C.transitions.resize = {animation:{duration:0}};
}
const gradFill = (top, bottom='rgba(0,0,0,0)') => ctx => {
  const {chart} = ctx, a = chart.chartArea; if (!a) return top;
  const g = chart.ctx.createLinearGradient(0, a.top, 0, a.bottom); g.addColorStop(0, top); g.addColorStop(1, bottom); return g;
};

  const L30 = learnStats(addDays(t,-29), t);
  if (!st.learn){
    const cand = LEARN_SECTORS.map(s => ({s, n:(L30.list.find(g => g.key === s.id) || {n:0}).n, left:pillsLeft(s.id).length})).filter(x => x.left).sort((a,b) => a.n - b.n)[0];
    if (cand) add(h >= 18 ? 7 : 5, 'tip', `Pillola consigliata: ${cand.s.short}`, `${cand.n ? `Negli ultimi 30 giorni solo ${plural(cand.n,'apprendimento','apprendimenti')} in ${cand.s.name}` : `Questo mese non hai ancora esplorato ${cand.s.name}`}: apri il Generatore di Sapere, 2 minuti di lettura e 3 domande veloci.${L30.items.length ? ' ' + learnSummary(L30, "Nell'ultimo mese", false) : ''}`, 'learn');
    else add(h >= 18 ? 7 : 5, 'push', 'Cosa hai imparato oggi?', 'Hai letto tutte le pillole disponibili: annota a mano un concetto di studio, un articolo o una lezione da una trattativa.', 'learn');
  }
  if (st.learn && L30.items.length) add(6, 'scale', 'La tua mappa di crescita', learnSummary(L30, "Nell'ultimo mese", false) + (L30.quizN ? ` Nei quiz: ${Math.round(L30.quizOk / L30.quizN * 100)}% di risposte corrette.` : '') + (L30.untouched.length ? ` Ancora da esplorare: ${L30.untouched.map(s => s.short).join(', ')}.` : ''), 'learn');
  // Overall
  // Sonno
  if (d.sleep !== null && d.sleep !== '' && d.sleep !== undefined){
    const sl = +d.sleep;
    if (sl < 6.5) add(9,'warn','Notte corta: gestisci l\'energia', `Hai dormito ${fmtDur(sl*3600)}. Oggi lavora a blocchi brevi da 25 minuti, niente caffeina dopo le 15 e letto entro le 23: il sonno perso si paga in concentrazione e decisioni.`);
    else if (sl < SLEEP_GOAL) add(6,'push','Sonno quasi a target', `${fmtDur(sl*3600)} stanotte: mancano ${fmtDur((SLEEP_GOAL-sl)*3600)} alle 8 ore. Stasera anticipa di mezz'ora: schermi via 30 minuti prima di dormire.`);
  if ('water' in st && !st.water && h >= 13){ const wl = +d.water || 0; add(5,'push','Idratazione', wl ? `${N1.format(wl)} L finora: mancano ${N1.format(WATER_GOAL - wl)} L ai 3 litri. Tieni la borraccia sulla scrivania e bevi un bicchiere a ogni pausa di studio.` : `Ancora nessun bicchiere registrato oggi. Parti subito con 500 ml: anche una lieve disidratazione riduce concentrazione e memoria di lavoro.`); }
    else if (sl >= 8) add(4,'scale','Recupero completo','8 ore di sonno: è il moltiplicatore nascosto di studio, corsa e trattative. Sfrutta il picco di lucidità per la task più difficile.');
  } else if (h >= 6 && h < 13) add(5,'tip','Registra il sonno di stanotte','Inserisci orario a letto e sveglia nel tracker: le ore si calcolano da sole. Il sonno è la base di tutte le altre abitudini.');
  if (past7.length >= 3){
    const sl7 = past7.map(k => S.days[k]?.sleep).filter(v => v !== null && v !== undefined && v !== '').map(Number);
    if (sl7.length >= 3 && avg(sl7) < 7.5) add(7,'warn','Debito di sonno in accumulo', `Media di ${fmtDur(avg(sl7)*3600)} a notte negli ultimi giorni. Fissa una sveglia anche per andare a letto: la costanza dell'orario conta più del weekend di recupero.`);
  }
  if (sc === NT) add(11,'scale',`Giornata perfetta: ${NT} su ${NT}`,'Hai chiuso tutto. Annota cosa ha funzionato oggi — orari, energia, ordine delle task: è la ricetta da replicare.');
  else if (sc >= winNeed(t) && h >= 15) add(6,'push',`Sei a ${sc}/${NT}: chiudi in bellezza`, `Mancano: ${missing.join(', ')}. Una giornata vincente si decide nelle ultime ore.`);
  if (avg7 !== null && past7.length >= 3){
    if (avg7 >= .85) add(8,'scale','Stai performando: è ora di scalare', `Media del ${Math.round(avg7*100)}% negli ultimi giorni. Alza l'asticella su un solo parametro: +1 attività contattata al giorno o +30 minuti di studio. Crescita composta, non caos.`);
    else if (avg7 < .45) add(8,'push','Riduci l\'attrito, non aumentare la forza di volontà', `Media del ${Math.round(avg7*100)}% negli ultimi giorni. Regola dei 2 minuti: per ogni abitudine fai solo la versione minima — 1 pagina, 1 km, 1 piatto. Il momentum farà il resto.`);
  }
  // CRM
  const active = S.clients.filter(c => !['chiuso','scartato'].includes(c.stage));
  const apptToday = active.filter(c => c.appt && c.appt.slice(0,10) === t);
  if (apptToday.length) add(10,'tip',`Appuntamento oggi: ${apptToday[0].name}`, 'Arriva con valore, non con un preventivo: 3 screenshot di siti di attività simili e una mini-analisi della loro scheda Google. Apri la Strategia nel CRM.');
  const stale = active.filter(c => c.stage === 'da_contattare' && diffDays(c.created || t, t) >= 3);
  if (stale.length) add(7,'push', `${plural(stale.length,'lead fermo','lead fermi')} da contattare`, `Parti da ${stale[0].name}. Le attività locali rispondono meglio di persona: passa nell'orario morto e presentati in 30 secondi.`);
  const props = active.filter(c => c.stage === 'proposta' && diffDays(c.updated || c.created || t, t) >= 3);
  if (props.length) add(8,'push','Follow-up sulle proposte', `${props.slice(0,2).map(c=>c.name).join(' e ')} ${props.length>1?'aspettano':'aspetta'} una tua risposta da giorni. Chi segue, chiude: chiama oggi con una domanda precisa, non con un "allora?".`);
  if (!S.clients.length) add(4,'tip','Apri la pipeline','Il CRM è vuoto. Esci oggi e annota 3 attività della tua zona senza sito o con un sito datato: la pipeline si costruisce un nome alla volta.');
  // Finanze
  const soon = S.subs.filter(s => { const n = diffDays(t, s.renewal); return n >= 0 && n <= 3; });
  if (soon.length) add(5,'tip',`Rinnovo ${soon[0].name} ${relDays(diffDays(t, soon[0].renewal))}`, `Addebito di ${EUR.format(soon[0].price)}. Chiediti: questo strumento mi ha fatto guadagnare o risparmiare più di quanto costa questo mese?`);

  out.sort((a,b) => b.p - a.p);
  const seen = new Set();
  const uniq = out.filter(x => { if (seen.has(x.title)) return false; seen.add(x.title); return true; });
  const top = uniq.slice(0,4), li = uniq.find(x => x.kind === 'learn');
  if (li && !top.includes(li)) top[top.length - 1] = li;
  return top;
}

function sparkSVG(vals, goal=null){
  const W = 100, H = 30, mx = Math.max(goal || 0, ...vals, 0.0001), n = vals.length;
  const pts = vals.map((v, i) => [n === 1 ? W : i / (n - 1) * W, H - 3 - v / mx * (H - 6)]);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const g = goal ? `<line x1="0" x2="${W}" y1="${(H - 3 - goal / mx * (H - 6)).toFixed(1)}" y2="${(H - 3 - goal / mx * (H - 6)).toFixed(1)}" class="sp-goal"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${g}<path class="sp-area" d="${d} L${W},${H} L0,${H} Z"/><path class="sp-line" d="${d}"/></svg>`;
}

const SC_RANGES = [7, 14, 30, 90];

function studyStreak(){
  const t = todayKey(); let k = studySecs(t) >= STUDY_GOAL ? t : addDays(t,-1), n = 0;
  while (k >= S.createdAt && studySecs(k) >= STUDY_GOAL){ n++; k = addDays(k,-1); }
  return n;
}
function studyBestStreak(){ let best = 0, cur = 0; for (const k of range(S.createdAt, todayKey())){ if (studySecs(k) >= STUDY_GOAL){ cur++; best = Math.max(best, cur); } else cur = 0; } return best; }
function scData(n){
  const t = todayKey(), keys = range(addDays(t, -(n-1)), t), prev = range(addDays(t, -(2*n-1)), addDays(t, -n)).filter(tracked), tk = keys.filter(tracked);
  const hrs = keys.map(k => tracked(k) ? +hOf(k).toFixed(3) : null);
  const ma = keys.map(k => { const w = range(addDays(k,-6), k).filter(tracked); return tracked(k) && w.length ? +(avg(w.map(hOf))).toFixed(3) : null; });
  const comp = keys.map(k => tracked(k) ? Math.round(ratio(k)*100) : null);
  const km = keys.map(k => tracked(k) && (+(S.days[k]?.km)||0) > 0 ? +S.days[k].km : null);
  const tot = sum(tk.map(hOf)), ptot = prev.length ? sum(prev.map(hOf)) : null;
  // media del periodo: oggi conta solo se l'obiettivo è già raggiunto (la giornata è ancora aperta)
  const closed = tk.filter(k => k !== t || studySecs(k) >= STUDY_GOAL);
  const avgH = closed.length ? avg(closed.map(hOf)) : 0, pclosed = prev.length ? avg(prev.map(hOf)) : null;
  const goalDays = tk.filter(k => studySecs(k) >= STUDY_GOAL).length;
  const best = tk.reduce((b, k) => b === null || hOf(k) > hOf(b) ? k : b, null);
  const [ms, me] = monthBounds(0), monthSoFar = sum(range(ms, t).filter(tracked).map(hOf));
  const pace14 = range(addDays(t,-14), addDays(t,-1)).filter(tracked), pace = pace14.length ? avg(pace14.map(hOf)) : avgH;
  const proj = monthSoFar + Math.max(0, pace) * diffDays(t, me) + (studySecs(t) < STUDY_GOAL ? Math.max(0, pace - hOf(t)) : 0);
  return {n, t, keys, hrs, ma, comp, km, tk, tot, ptot, avgH, pavg:pclosed, goalDays, best, monthSoFar, proj,
    cons: closed.length ? Math.round(tk.filter(k => studySecs(k) >= STUDY_GOAL).length / Math.max(1, closed.length) * 100) : 0,
    closedN: closed.length, streak: studyStreak(), bestStreak: studyBestStreak()};
}

function openPill(sid, avoidId){
  const s = sectorOf(sid); if (!s) return;
  if (!PILLS.length){ openModal({eyebrow:'Generatore di Sapere', title:'Libreria non disponibile', body:`<p class="muted" style="margin:0">Il file <code>pillole.js</code> non è stato caricato: deve trovarsi nella stessa cartella di <code>index.html</code>. Nel frattempo puoi usare l'inserimento manuale.</p>`}); return; }
  let pool = pillsLeft(sid);
  if (!pool.length){
    const total = PILLS.filter(p => p.sector === sid).length;
    openModal({eyebrow:s.name, title:'Settore completato', body:`
      <div class="pill-box" style="--c:${s.color};margin-top:0"><div class="eyebrow" style="color:var(--c)">${icon('crown')} Tutte lette</div><p>Hai letto e verificato tutte le ${total} pillole di ${s.name}. Scegli un altro settore oppure annota a mano un nuovo apprendimento.</p></div>
      <div class="label" style="margin:18px 0 10px">Altri settori</div>${sectorGridHTML()}`});

      <div class="pill-meta"><span class="sec-chip">${icon(s.icon)} ${s.name}</span><span class="small muted row" style="gap:6px">${icon('clock')} ${mins} min di lettura · ${plural(pillsLeft(sid).length,'pillola nuova','pillole nuove')} nel settore</span></div>
      <p class="pill-kicker">${esc(p.kicker)}</p>
      <div class="pill-body">${p.body.map(x => `<p>${esc(x)}</p>`).join('')}</div>
      <div class="pill-box"><div class="eyebrow" style="color:var(--c)">${icon('spark')} Lo sapevi?</div><p>${esc(p.curiosity)}</p></div>
      <div class="pill-box apply"><div class="eyebrow gold">${icon('target')} Applicalo al tuo business</div><p>${esc(p.apply)}</p></div>

    </article>`});
}
function showQuiz(){
  const p = LQ.pill; if (!p) return;
  const s = sectorOf(p.sector);
  LQ.order = p.quiz.map(q => shuffle(q.o.map((_, i) => i)));
  LQ.answers = p.quiz.map(() => null);

  $('#modalBody').innerHTML = `<div class="quiz" style="--c:${s.color}">
    <p class="small muted" style="margin:0 0 4px">Nessun voto e nessun blocco: è solo un controllo veloce per fissare i concetti chiave. Rispondi d'istinto.</p>
    ${p.quiz.map((q, qi) => `<div class="quiz-q" data-q="${qi}"><div class="quiz-n">Domanda ${qi+1} di ${p.quiz.length}</div><h5>${esc(q.q)}</h5>
      <div class="quiz-opts">${LQ.order[qi].map(oi => `<button class="quiz-opt" data-act="quiz-answer" data-q="${qi}" data-v="${oi}">${esc(q.o[oi])}</button>`).join('')}</div>
      <div class="quiz-why" hidden></div></div>`).join('')}
    <div id="quizEnd"></div></div>`;
  $('.modal').scrollTop = 0;
}
function answerQuiz(qi, oi){
  const p = LQ.pill; if (!p || LQ.answers[qi] !== null) return;
  LQ.answers[qi] = oi;
  const q = p.quiz[qi], ok = oi === q.a, box = $(`.quiz-q[data-q="${qi}"]`);
  $$('.quiz-opt', box).forEach(b => { const v = +b.dataset.v; b.disabled = true; if (v === q.a) b.classList.add('ok'); else if (v === oi) b.classList.add('ko'); });
  box.classList.add(ok ? 'is-ok' : 'is-ko');
  const why = $('.quiz-why', box); why.hidden = false;
  why.innerHTML = `${ok ? '<b class="em">Esatto.</b>' : '<b class="ruby">Non proprio.</b>'} ${esc(q.why)}`;
  if (LQ.answers.every(a => a !== null)) completePill();
}
function completePill(){
  const p = LQ.pill, k = LQ.day || todayKey(), n = p.quiz.length;
  const okN = LQ.answers.filter((a, i) => a === p.quiz[i].a).length;
  const d = getDay(k, true), before = score(k);
  d.learnItems.push({id:uid(), type:'pill', pillId:p.id, sector:p.sector, title:p.title, quiz:{ok:okN, n}, at:Date.now()});
  (S.pillsDone ||= {})[p.id] = {date:k, sector:p.sector, ok:okN, n};
  save();
  const msg = okN === n ? 'Tre su tre: concetti fissati alla perfezione.' : okN >= 2 ? 'Ottimo: i concetti chiave ci sono.' : 'Nessun problema: rileggerla tra qualche giorno fisserà meglio i punti chiave.';
  $('#quizEnd').innerHTML = `<div class="quiz-sum"><div class="quiz-score"><span class="serif">${okN}<small>/${n}</small></span><span class="eyebrow">corrette</span></div>
      <div style="min-width:0"><b>${msg}</b><p class="small muted" style="margin:5px 0 0">Pillola salvata nella task «Imparare» di ${k === todayKey() ? 'oggi' : fmtDate(k,{day:'numeric', month:'long'})}, settore ${sectorOf(p.sector).name}. Non ti verrà più riproposta.</p></div></div>
    <div class="modal-foot wrap"><button class="btn" data-act="pill-next" data-v="${p.sector}">${icon('spark')} Un'altra pillola</button><button class="btn btn-gold" data-close>Chiudi</button></div>`;
  setTimeout(() => $('#quizEnd')?.scrollIntoView({behavior:'smooth', block:'nearest'}), 60);
  LQ.pill = null;
  afterLearnChange(k, before);
}

function confirmManualLearn(form, fd){
  const k = form.dataset.day || learnDay(), d = getDay(k, true), txt = (d.learnDraft || '').trim();
  let sector = fd.sector || '', label = '';
  if (!sector){ toast('Scegli un settore.', {tone:'ruby'}); return; }
  if (sector === 'altro:__new'){
    label = (fd.custom || '').trim().replace(/\s+/g, ' ');
    if (label.length < 2){ toast('Scrivi il nome della categoria personalizzata.', {tone:'ruby'}); $('#learnCustom')?.focus(); return; }
    const exist = (S.learnLabels ||= []).find(l => l.toLowerCase() === label.toLowerCase());
    if (exist) label = exist; else S.learnLabels.push(label);
    sector = 'altro';
  } else if (sector.startsWith('altro:')){ label = sector.slice(6); sector = 'altro'; }
  const before = score(k);
  d.learnItems.push({id:uid(), type:'manual', sector, ...(label ? {label} : {}), title:learnTitle(txt), text:txt, at:Date.now()});
  d.learnDraft = '';
  save(); closeModal();
  toast(`Apprendimento salvato in ${esc(sector === 'altro' ? label : sectorOf(sector).short)}.`, {tone:'em', icon:'bulb'});
  afterLearnChange(k, before);
}
function deleteLearnItem(id){
  const k = viewDay, d = getDay(k, true), it = d.learnItems.find(x => x.id === id); if (!it) return;
  if (!confirm(`Rimuovere «${it.title}» dalla task di questa giornata?${it.type === 'pill' ? ' La pillola tornerà disponibile nel Generatore.' : ''}`)) return;
  d.learnItems = d.learnItems.filter(x => x.id !== id);
  if (it.type === 'pill' && it.pillId && S.pillsDone) delete S.pillsDone[it.pillId];
  prevScore = score(k); afterHabitChange('learn');
}
function afterLearnChange(k, before){
  if (route === 'tracker' && k === viewDay){ prevScore = before; afterHabitChange('learn'); return; }
  const after = score(k);
  if (k === todayKey() && after > before){
    if (after === total(k)) toast(`Giornata perfetta: ${after} obiettivi su ${after}. Standard da campione.`, {tone:'em', icon:'crown'});
    else if (after === winNeed(k)) toast(`Giornata vincente sbloccata: ${after}/${total(k)}.`, {tone:'em', icon:'fire'});
  }
  rerender();
}

/* ---- Analisi per settore ---- */
function learnStats(a, b){
  const items = range(a, b).filter(tracked).flatMap(k => learnItems(k).map(x => ({...x, day:k})));
  const groups = {};
  items.forEach(x => {
    const key = x.sector === 'altro' ? 'altro:' + (x.label || 'Altro').toLowerCase() : x.sector;
    const g = groups[key] ||= {key, sector:x.sector, label:sectorLabel(x), short:sectorShort(x), color:sectorColor(x), icon:sectorIcon(x), pills:0, manual:0};
    if (x.type === 'pill') g.pills++; else g.manual++;
  });
  const list = Object.values(groups).map(g => ({...g, n:g.pills + g.manual})).sort((x, y) => y.n - x.n);
  const qz = items.filter(x => x.quiz);
  return {items, list, pills:items.filter(x => x.type === 'pill').length, manual:items.filter(x => x.type === 'manual').length,
    quizOk:sum(qz.map(x => x.quiz.ok)), quizN:sum(qz.map(x => x.quiz.n)), untouched:LEARN_SECTORS.filter(s => !groups[s.id])};
}
const LEARN_LEAD = {7:"Nell'ultima settimana", 30:"Nell'ultimo mese", 90:'Negli ultimi tre mesi', 365:"Nell'ultimo anno"};
function learnSummary(L, lead, html=true){
  if (!L.items.length) return '';
  const B = t => html ? `<strong>${esc(t)}</strong>` : t;
  const what = g => g.manual === 0 ? plural(g.pills,'pillola','pillole') : g.pills === 0 ? plural(g.manual,'appunto','appunti') : `${plural(g.pills,'pillola','pillole')} e ${plural(g.manual,'appunto','appunti')}`;
  const std = L.list.filter(g => g.sector !== 'altro'), cus = L.list.filter(g => g.sector === 'altro'), parts = [];
  if (std.length){ const top = std.slice(0, 3).map(g => `${B(g.label)} (${what(g)})`); if (std.length > 3) top.push(`altri ${std.length - 3} settori`); parts.push(`hai focalizzato la tua crescita su ${cus.length ? top.join(', ') : listJoin(top)}`); }
  if (cus.length){ const nC = sum(cus.map(g => g.n)); parts.push(`hai aggiunto ${plural(nC,'argomento personalizzato','argomenti personalizzati')} in ${listJoin(cus.map(g => B('«' + g.label + '»')))}`); }
  return `${lead} ${parts.join(' e ')}.`;
}

    <div class="card-head"><div><div class="eyebrow">Crescita personale · ${periodLabel}</div><h3 class="card-title">Apprendimento per settore</h3></div>
      <div class="row wrap" style="gap:8px"><span class="pill plain">${plural(L.pills,'pillola','pillole')}</span><span class="pill plain">${plural(L.manual,'appunto','appunti')}</span>${pct !== null ? `<span class="pill ${pct >= 67 ? 'done' : 'progress'}">Quiz ${pct}%</span>` : ''}</div></div>
    ${L.items.length ? `<div class="learn-stats">
      <div class="sec-rows">${L.list.map(g => `<div class="sec-row" style="--c:${g.color}"><span class="row" style="gap:10px;min-width:0"><span class="sec-ic sm">${icon(g.icon)}</span><span class="sec-name" title="${esc(g.label)}">${esc(g.label)}</span></span><div class="sec-bar"><i style="width:${g.n / max * 100}%"></i></div><b>${g.n}</b></div>`).join('')}</div>
      <div class="learn-text"><p>${learnSummary(L, LEARN_LEAD[days] || 'Nel periodo')}</p>
        ${pct !== null ? `<p>Nei quiz di verifica hai risposto correttamente a <strong>${plural(L.quizOk,'domanda','domande')} su ${L.quizN}</strong> (${pct}%). ${pct >= 80 ? 'Comprensione eccellente.' : pct >= 60 ? 'Buona comprensione dei concetti chiave.' : 'Rileggere le pillole tra qualche giorno aiuterà a fissarle.'}</p>` : ''}
        ${L.untouched.length ? `<p>Settori ancora da esplorare: ${L.untouched.map(s => `<span class="sec-tag chip-tag" style="--c:${s.color}">${s.short}</span>`).join(' ')}</p>` : '<p>Hai toccato tutti e sei i settori: un profilo di crescita davvero completo.</p>'}</div>
    </div>` : `<div class="empty"><div class="serif">Nessun apprendimento nel periodo</div>Leggi una pillola dal Generatore di Sapere o annota a mano cosa hai imparato: qui vedrai su quali settori stai crescendo.</div>`}
  </section>`;
}

function renderFinance(){

  const sites = S.incomes.filter(i => i.type === 'sito'), sitesM = sum(sites.filter(i => i.date >= ms && i.date <= me).map(i => i.amount));
  const delta = incP ? (incM - incP)/incP : null;
  const now = new Date(), lastK = lastDayKey(now.getFullYear(), now.getMonth()), nl = diffDays(t, lastK);
  const list = [...S.incomes].sort((a,b) => b.date.localeCompare(a.date) || 0);
  const groups = {}; list.forEach(i => (groups[i.date.slice(0,7)] ||= []).push(i));
  const clientNames = [...new Set(S.clients.map(c => c.name))];

  $('#view').innerHTML = `
  <section class="kpis">
    <div class="card kpi"><div class="kpi-top"><span class="eyebrow">Entrate · ${fmtDate(t,{month:'long'})}</span>${icon('euro')}</div><div class="kpi-val em">${EUR0.format(incM)}</div><div class="kpi-sub">${delta===null?'Primo mese registrato':`<span class="delta ${delta>0?'up':delta<0?'down':'flat'}">${delta>0?'+':''}${Math.round(delta*100)}%</span> vs mese scorso`}</div></div>
    <div class="card kpi"><div class="kpi-top"><span class="eyebrow">Siti venduti · mese</span>${icon('briefcase')}</div><div class="kpi-val gold">${EUR0.format(sitesM)}</div><div class="kpi-sub">${plural(sites.length,'vendita','vendite')} in totale · ${EUR0.format(sum(sites.map(i=>i.amount)))}</div></div>

  const rate = (won.length + lost.length) ? won.length/(won.length+lost.length) : null;
  const next = active.filter(c => c.appt && c.appt.slice(0,10) >= todayKey()).sort((a,b) => a.appt.localeCompare(b.appt))[0];
  const f = S.ui.crmFilter, q = crmQuery.trim().toLowerCase();

    <div class="pipe">${all.length ? Object.entries(STAGES).filter(([k])=>counts[k]).map(([k,s]) => `<i style="width:${counts[k]/all.length*100}%;background:${s.color}" title="${s.label}: ${counts[k]}"></i>`).join('') : ''}</div>
    <div class="legend">

      ${Object.entries(STAGES).map(([k,s]) => `<button class="${f===k?'on':''}" data-act="crm-filter" data-v="${k}"><i style="background:${s.color}"></i>${s.label} <b>${counts[k]}</b></button>`).join('')}

function strategyHTML(c){
  const sec = SECTORS[c.sector] || SECTORS.altro, r = +c.rating||0, price = +c.price||0;
  const first = (c.contact||'').split(' ')[0], me = S.profile.name || '[il tuo nome]';

  const ratingAdv = r === 0 ? 'Non hai ancora parlato col titolare: obiettivo del primo contatto è capire tre cose — chi decide, se c\'è budget e quanto è urgente il problema.'
    : r <= 2 ? 'Probabilità bassa: non investire troppo tempo. Qualifica in fretta (chi decide? c\'è budget?) e se le risposte restano vaghe sposta le energie su lead più caldi. Lascia la porta aperta.'
    : r === 3 ? 'Probabilità media: manca l\'urgenza. Mostra cosa sta perdendo oggi — un concorrente vicino con sito e prenotazioni online — e proponi una scadenza reale per l\'offerta.'
    : 'Probabilità alta: è il momento di chiudere. Usa la chiusura alternativa — "Partiamo lunedì o preferisce a inizio mese?" — e porta con te contratto e modulo d\'acconto.';
  const base = price || Math.round((sec.range[0]+sec.range[1])/2/50)*50;
  const r10 = n => Math.max(50, Math.round(n/50)*50);
  const tiers = [['Base', r10(base*.65), 'Sito vetrina 1 pagina, contatti, mappa, mobile-first'],['Consigliato', r10(base), 'Sito multi-pagina, galleria, Google Business ottimizzato, WhatsApp'],['Premium', r10(base*1.6), 'Tutto il Consigliato + prenotazioni/catalogo, foto professionali, 3 mesi di gestione']];
  const maint = Math.max(19, Math.round(base*.045/5)*5);
  const perClient = sec === SECTORS.ristorazione ? 25 : sec === SECTORS.beauty ? 30 : sec === SECTORS.turismo ? 120 : 60;
  const payback = Math.max(1, Math.ceil(base/(perClient*4)));
  const objections = OBJECTIONS.map(([q,a]) => [q, a || `Capisco. Facciamo due conti insieme: quanto vale per lei un cliente nuovo? Se il sito ne porta anche solo uno a settimana, si ripaga in circa ${plural(payback,'mese','mesi')}. E possiamo dividerlo in 3 rate da ${EUR0.format(Math.round(base/3))}. Non è un costo: è il commerciale che lavora per lei 24 ore su 24.`]);

    <div class="script">${script}</div>
    <p class="small muted" style="margin:10px 0 0">${icon('clock')} ${esc(sec.when)}</p>
    <h4>${icon('target')} Il pitch per ${esc(sec.label.toLowerCase())}</h4>

    <ul>${sec.pains.map(p => `<li><strong style="color:var(--text)">Dolore:</strong> ${esc(p)}</li>`).join('')}<li><strong style="color:var(--text)">Demo:</strong> ${esc(sec.demo)}</li></ul>
    <h4>${icon('bolt')} Prossima mossa · ${STAGES[c.stage].label}</h4>
    <ul>${STAGE_PLAY[c.stage].map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <h4>${icon('compass')} Lettura della probabilità</h4>
    <p style="margin:0;color:var(--text-2);line-height:1.6">${esc(ratingAdv)}</p>
    <h4>${icon('euro')} Struttura del prezzo ${price?'':'(stima di settore)'}</h4>
    <div class="tiers">${tiers.map((x,i) => `<div class="tier ${i===1?'rec':''}"><div class="eyebrow ${i===1?'gold':''}">${x[0]}${i===1?' · consigliato':''}</div><b>${EUR0.format(x[1])}</b><span>${x[2]}</span></div>`).join('')}</div>
    <ul class="mt-12"><li>Presenta prima il Premium: ancora il valore e fa sembrare il Consigliato un affare.</li><li>Pagamento: 50% di acconto, 50% alla consegna — oppure 3 rate da ${EUR0.format(Math.round(base/3))}.</li><li>Canone manutenzione suggerito: ${EUR0.format(maint)}/mese. Upsell: ${esc(sec.upsell)}</li></ul>
    <h4>${icon('shield')} Obiezioni tipiche dei negozi locali</h4>
    ${objections.map(([q,a],i) => `<details class="obj" ${i===1&&r>=3?'open':''}><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}

function bucketsFor(days){
  const t = todayKey(), start = addDays(t, -(days-1)), keys = range(start, t);
  if (days <= 31) return keys.map(k => ({label: fmtDate(k, days<=7?{weekday:'short'}:{day:'numeric', month:'short'}).replace('.',''), keys:[k]}));
  if (days <= 120){
    const out = []; let cur = null;
    keys.forEach(k => { const dow = (parse(k).getDay()+6)%7; if (!cur || dow === 0){ cur = {label:fmtDate(k,{day:'numeric', month:'short'}), keys:[]}; out.push(cur); } cur.keys.push(k); });
    return out;
  }
  const out = {}; keys.forEach(k => { const mk = k.slice(0,7); (out[mk] ||= {label:cap(fmtDate(mk+'-01',{month:'short'}).replace('.','')), keys:[]}).keys.push(k); });
  return Object.values(out);
}
function periodMetrics(a, b){
  const keys = range(a, b).filter(tracked);
  const n = keys.length;
  const rates = {}, den = {}; HABITS.forEach(h => { rates[h.id] = 0; den[h.id] = 0; });
  const sts = keys.map(k => status(k));
  sts.forEach(s => HABITS.forEach(h => { if (h.id in s){ den[h.id]++; if (s[h.id]) rates[h.id]++; } }));
  HABITS.forEach(h => rates[h.id] = den[h.id] ? rates[h.id]/den[h.id] : 0);
  const socialLogged = keys.map(k => S.days[k]?.social).filter(v => v !== null && v !== undefined && v !== '').map(Number);
  const runs = keys.map(k => +(S.days[k]?.km)||0).filter(x => x > 0);
  const byDow = Array.from({length:7}, () => []);
  const rts = keys.map(ratio);
  keys.forEach((k,i) => byDow[(parse(k).getDay()+6)%7].push(rts[i]));
  const sleepLogged = keys.map(k => S.days[k]?.sleep).filter(v => v !== null && v !== undefined && v !== '').map(Number);
  const waterLogged = keys.filter(k => k >= (S.waterSince || S.createdAt)).map(k => S.days[k]?.water).filter(v => v !== null && v !== undefined && v !== '').map(Number);
  return {
    n, keys, rates, den,
    completion: n ? avg(rts) : 0,
    perfect: sts.filter(s => Object.values(s).every(Boolean)).length,
    wins: keys.filter(isWin).length,
    waterAvg: waterLogged.length ? avg(waterLogged) : null, waterOk: waterLogged.filter(v => v >= WATER_GOAL).length,
    sleepAvg: sleepLogged.length ? avg(sleepLogged) : null, sleepOk: sleepLogged.filter(v => v >= SLEEP_GOAL).length,
    studyH: sum(keys.map(studySecs))/3600,
    km: sum(runs), runDays: runs.length,
    socialAvg: socialLogged.length ? avg(socialLogged) : null, socialOver: socialLogged.filter(v => v >= SOCIAL_LIMIT).length,
    films: sum(keys.map(k => S.days[k]?.films?.length || 0)),
    learned: keys.filter(k => status(k).learn).length,
    learn: learnStats(a, b),
    income: incomeIn(a, b),
    leads: S.clients.filter(c => c.created && c.created >= a && c.created <= b).length,
    dow: byDow.map(x => x.length ? avg(x) : null),
  };
}

  if (M.waterAvg !== null) p.push(`<strong>Idratazione:</strong> media di ${N1.format(M.waterAvg)} L al giorno, ${plural(M.waterOk,'giorno','giorni')} da 3 litri o più. ${M.waterAvg >= WATER_GOAL ? 'Ottimo: concentrazione e recupero ne beneficiano.' : 'Usa una borraccia da 1 litro e riempila tre volte: è il modo più semplice per arrivare a 3 litri.'}`);
  if (M.sleepAvg !== null) p.push(`<strong>Sonno:</strong> media di ${fmtDur(M.sleepAvg*3600)} a notte, ${plural(M.sleepOk,'notte','notti')} da 8 ore o più. ${M.sleepAvg >= SLEEP_GOAL ? 'Base solida: il recupero sostiene studio e corsa.' : M.sleepAvg >= 7 ? 'Quasi a target: anticipa di 30 minuti l\'orario a letto.' : 'Debito di sonno evidente: è la prima leva da sistemare, prima ancora dello studio.'}`);
  if (bestDow && worstDow && bestDow[1] !== worstDow[1]) p.push(`Il tuo giorno migliore è il <strong>${dowNames[bestDow[1]]}</strong> (${Math.round(bestDow[0]*100)}%), il più debole il <strong>${dowNames[worstDow[1]]}</strong> (${Math.round(worstDow[0]*100)}%). Replica la struttura del ${dowNames[bestDow[1]]} — orari, sveglia, ordine delle task — nei giorni più fragili.`);
  const LS = M.learn;
  p.push(LS.items.length
    ? `<strong>Apprendimento:</strong> ${learnSummary(LS, LEARN_LEAD[days] || 'Nel periodo')}${LS.quizN ? ` Nei quiz di verifica hai risposto bene a ${plural(LS.quizOk,'domanda','domande')} su ${LS.quizN} (${Math.round(LS.quizOk / LS.quizN * 100)}%).` : ''}${LS.untouched.length && LS.untouched.length < 6 ? ` Per una crescita più completa esplora anche ${listJoin(LS.untouched.map(x => x.name))}.` : ''}`
    : `<strong>Apprendimento:</strong> nessuna pillola o appunto registrato nel periodo. Una pillola al giorno dal Generatore di Sapere costruisce, in un mese, trenta concetti nuovi.`);
  p.push(`<strong>Business:</strong> ${EUR.format(M.income)} di entrate registrate nel periodo${M.leads?` e ${plural(M.leads,'nuovo lead','nuovi lead')} in pipeline`:''}. ${M.leads<Math.max(1,Math.round(M.n/7))?'Obiettivo consigliato: almeno 2 nuove attività contattate a settimana.':'Buon ritmo di prospezione: ora concentrati sui follow-up.'}`);
  const plan = (worst.length ? worst : sorted.slice(-3)).slice(0,3).map(h => [h.name, HABIT_FIX[h.id]]);
  while (plan.length < 3) plan.push(['Scaling', 'Alza di un livello un solo parametro: +30 minuti di studio o +1 km per uscita. Crescita composta.']);
  return p.map(x => `<p>${x}</p>`).join('') + `<div class="eyebrow gold" style="margin:20px 0 10px">Piano d'azione per il prossimo periodo</div><div class="plan">${plan.map((x,i) => `<div><span>0${i+1}</span><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div>`;
}

function fadeAppearance(){ const r = document.documentElement; r.classList.add('theming'); clearTimeout(fadeAppearance.t); fadeAppearance.t = setTimeout(() => r.classList.remove('theming'), 650); }
function syncAppearanceUI(){
  const th = currentTheme(), ly = currentLayout();
  const mark = (el, on) => { el.classList.toggle('on', on); el.setAttribute('aria-checked', String(on)); };
  $$('[data-theme-opt]').forEach(el => mark(el, el.dataset.themeOpt === th));
  $$('[data-layout-opt]').forEach(el => mark(el, el.dataset.layoutOpt === ly));
  $$('[data-preset-opt]').forEach(el => { const p = PRESETS.find(x => x.id === el.dataset.presetOpt); mark(el, !!p && p.theme === th && p.layout === ly); });
  $$('[data-style-now]').forEach(el => el.innerHTML = styleNowHTML());
}
function applyTheme(id, {silent=false, render=true} = {}){
  const t = THEMES.find(x => x.id === id) || THEMES[0], root = document.documentElement, changed = root.dataset.theme !== t.id;
  if (changed && !silent) fadeAppearance();
  root.dataset.theme = t.id;
  try { localStorage.setItem('qg.theme', t.id); } catch(e){}
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t.meta);
  if (S.ui.theme !== t.id){ S.ui.theme = t.id; save(); }
  syncAppearanceUI();
  if (changed && !silent && render){ rerender(); toast(`Palette ${t.name} attivata.`, {tone:'em', icon:'palette'}); }
  return changed;
}
function applyLayout(id, {silent=false, render=true} = {}){
  const l = LAYOUTS.find(x => x.id === id) || LAYOUTS[0], root = document.documentElement, changed = root.dataset.layout !== l.id;
  if (changed && !silent) fadeAppearance();
  root.dataset.layout = l.id;
  try { localStorage.setItem('qg.layout', l.id); } catch(e){}
  if (S.ui.layout !== l.id){ S.ui.layout = l.id; save(); }
  syncAppearanceUI();
  if (changed && !silent && render){ go(); window.scrollTo(0,0); toast(`Layout ${l.name} attivato.`, {tone:'em', icon:'grid'}); }
  return changed;
}
function applyPreset(id){
  const p = PRESETS.find(x => x.id === id); if (!p) return;
  const a = applyTheme(p.theme, {render:false}), b = applyLayout(p.layout, {render:false});
  if (a || b){ go(); window.scrollTo(0,0); toast(`Stile ${p.name} attivato.`, {tone:'em', icon:'crown'}); }
}
function styleNowHTML(){
  const p = currentPreset(), th = THEMES.find(t => t.id === currentTheme()), ly = LAYOUTS.find(l => l.id === currentLayout());

}

      </div>
    </div>
    <div class="note mt-18">${icon('bulb')}<div>Installata si apre <strong>a schermo intero</strong>, senza barre del browser, e funziona <strong>anche offline</strong>. I dati restano salvati sul dispositivo: se prima usavi la dashboard altrove, fai <em>Esporta backup</em> lì e <em>Importa backup</em> nell'app (Impostazioni).</div></div>`});
}
function refreshInstallUI(){
  document.documentElement.classList.toggle('is-app', PWA.isApp);
  const sb = $('#sideInstall'); if (sb) sb.hidden = PWA.isApp;
  const b = $('#installBanner'); if (b) b.outerHTML = installBanner();
}
async function promptInstall(){
  if (!PWA.deferred) return installModal();
  const p = PWA.deferred; PWA.deferred = null;
  try { await p.prompt(); const r = await p.userChoice; if (r && r.outcome === 'dismissed') toast('Installazione annullata: puoi riprovare quando vuoi.'); } catch(e){ installModal(); }
  refreshInstallUI();
}
function registerSW(){
  if (!PWA.canSW) return;
  const askUpdate = w => toast('Nuova versione dell\'app disponibile.', {icon:'spark', ms:20000, action:{label:'Aggiorna', fn:() => { PWA.refreshing = true; w.postMessage({type:'SKIP_WAITING'}); }}});
  navigator.serviceWorker.register('./sw.js').then(reg => {
    if (reg.waiting && navigator.serviceWorker.controller) askUpdate(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) askUpdate(w); });
    });
    setInterval(() => reg.update().catch(() => {}), 60*60*1000);
  }).catch(err => console.warn('Service worker non registrato:', err));
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (PWA.refreshing) location.reload(); });
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); PWA.deferred = e; refreshInstallUI(); });
window.addEventListener('appinstalled', () => { PWA.deferred = null; toast('App installata: la trovi sulla schermata Home.', {tone:'em', icon:'crown'}); refreshInstallUI(); });
const dm = matchMedia('(display-mode: standalone)'); dm.addEventListener ? dm.addEventListener('change', refreshInstallUI) : dm.addListener && dm.addListener(refreshInstallUI);
window.addEventListener('offline', () => toast('Sei offline: l\'app continua a funzionare e salva tutto sul dispositivo.', {icon:'wifiOff'}));
window.addEventListener('online', () => toast('Di nuovo online.', {tone:'em', icon:'check'}));
// Su telefono le app in background possono essere chiuse senza "beforeunload": salva subito.

/* =========================================================

document.addEventListener('click', e => {

    case 'settings': settingsModal(); break;
    case 'theme-menu': toggleThemeMenu(); break;
    case 'theme-set': applyTheme(v); break;
    case 'layout-set': applyLayout(v); break;
    case 'preset-set': applyPreset(v); break;
    case 'set-tab': setSettingsTab(v); break;
    case 'sc-range': S.ui.scRange = +v; save(); scRefresh(); break;
    case 'gp-toggle': { gpHide[v] = !gpHide[v]; el.classList.toggle('off', gpHide[v]); el.setAttribute('aria-pressed', String(!gpHide[v])); const c = charts.cGeneral; if (c){ c.setDatasetVisibility(GP_DS[v], !gpHide[v]); c.update(); } break; }
    case 'sc-toggle': { scHide[v] = !scHide[v]; el.classList.toggle('off', scHide[v]); el.setAttribute('aria-pressed', String(!scHide[v])); const c = charts.cStudy; if (c){ if (v === 'ma') c.setDatasetVisibility(1, !scHide.ma); c.update(); } break; }
    case 'home-tab': { S.ui.homeTab = v; save(); const panel = $('#ctabPanel'); if (panel){ panel.outerHTML = `<div class="ctab-panel" id="ctabPanel" role="tabpanel">${compactTabPanel(v, homeData())}</div>`; $$('.ctabs [data-act="home-tab"]').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-selected', String(on)); }); } break; }
    case 'q-timer': S.timer ? stopTimer() : startTimer(); renderNav(); rerender(); break;
    case 'q-skin': quickChange(dd => { dd.skin = !dd.skin; }); break;
    case 'q-social': quickChange(dd => { dd.social = Math.max(0, (+dd.social||0) + 5); }); break;
    case 'learn-mode': learnMode = v === 'man' ? 'man' : 'gen'; replaceCard('learn'); if (learnMode === 'man') setTimeout(() => $('[data-field="learnDraft"]')?.focus(), 30); break;
    case 'learn-save': saveManualLearn(); break;
    case 'learn-del': deleteLearnItem(id); break;
    case 'pill-open': openPill(v); break;
    case 'pill-next': openPill(v, LQ.pill?.id); break;
    case 'pill-understood': showQuiz(); break;
    case 'quiz-answer': answerQuiz(+el.dataset.q, +v); break;
    case 'q-learn': learnHubModal(); break;
    case 'learn-manual-home': closeModal(); learnMode = 'man'; viewDay = todayKey(); if (location.hash === '#tracker') renderTracker(); else location.hash = '#tracker'; setTimeout(() => { const t = $('[data-field="learnDraft"]'); if (t){ t.scrollIntoView({block:'center'}); t.focus(); } }, 120); break;
    case 'q-run': quickChange(dd => { dd.km = +((+dd.km||0) + 1).toFixed(2); }); break;
    case 'q-water': quickChange(dd => { dd.water = +((+dd.water||0) + .5).toFixed(2); }); break;
    case 'water-step': { prevScore = score(k); const dd = d(); dd.water = clamp(+((+dd.water||0) + +v).toFixed(2), 0, 15); afterHabitChange('water'); break; }
    case 'water-set': { prevScore = score(k); d().water = +v; afterHabitChange('water'); break; }
    case 'water-glass': { prevScore = score(k); const dd = d(), cur = +dd.water||0; dd.water = Math.abs(cur - +v) < 1e-6 ? +(+v - .25).toFixed(2) : +v; afterHabitChange('water'); break; }
    case 'q-sleep': quickChange(dd => { dd.sleep = (+dd.sleep||0) >= SLEEP_GOAL ? null : SLEEP_GOAL; dd.bed = dd.wake = ''; }); break;
    case 'q-study-add': quickChange(dd => { dd.studySec = Math.max(0, (dd.studySec||0) + +v); }); break;
    case 'theme-more': toggleThemeMenu(false); settingsModal(); break;
    case 'install': if (!$('#modal').hidden) closeModal(); promptInstall(); break;
    case 'install-guide': installModal(); break;
    case 'install-dismiss': S.ui.installDismissed = true; save(); refreshInstallUI(); toast('Ok. La guida resta disponibile in Impostazioni.'); break;
    case 'quick-study': startTimer(); location.hash = '#tracker'; break;
    // tracker
    case 'day-prev': viewDay = addDays(viewDay, -1); prevScore = null; renderTracker(); break;
    case 'day-next': if (viewDay < todayKey()){ viewDay = addDays(viewDay, 1); prevScore = null; renderTracker(); } break;
    case 'day-today': viewDay = todayKey(); prevScore = null; renderTracker(); break;
    case 'timer-start': prevScore = score(k); startTimer(); replaceCard('study'); renderNav(); break;
    case 'timer-stop': prevScore = score(k); stopTimer(); replaceCard('study'); renderNav(); break;
    case 'study-add': { prevScore = score(k); const dd = d(); dd.studySec = Math.max(0, (dd.studySec||0) + +v); afterHabitChange('study'); break; }
    case 'home-toggle': { prevScore = score(k); const a = d().home.acts, i = a.indexOf(v); i >= 0 ? a.splice(i,1) : a.push(v); afterHabitChange('home'); break; }
    case 'social-step': { prevScore = score(k); const dd = d(); dd.social = Math.max(0, (+dd.social||0) + +v); afterHabitChange('social'); break; }
    case 'social-set': { prevScore = score(k); d().social = +v; afterHabitChange('social'); break; }
    case 'run-step': { prevScore = score(k); const dd = d(); dd.km = Math.max(0, +((+dd.km||0) + +v).toFixed(2)); afterHabitChange('run'); break; }
    case 'run-set': { prevScore = score(k); d().km = +v; afterHabitChange('run'); break; }
    case 'film-del': { prevScore = score(k); d().films.splice(+v,1); afterHabitChange('cinema'); break; }
    case 'skin-toggle': { prevScore = score(k); const dd = d(); dd.skin = !dd.skin; afterHabitChange('skin'); break; }
    case 'sleep-step': { prevScore = score(k); const dd = d(); dd.sleep = clamp(+((+dd.sleep||0) + +v).toFixed(2), 0, 24); dd.bed = dd.wake = ''; afterHabitChange('sleep'); break; }
    case 'sleep-set': { prevScore = score(k); const dd = d(); dd.sleep = +v; dd.bed = dd.wake = ''; afterHabitChange('sleep'); break; }
    // home reminders
    case 'rem-done': { const r = S.reminders.find(x => x.id === id); if (r){ r.done = true; save(); toast('Promemoria completato.', {tone:'em'}); rerender(); } break; }
    case 'rem-del': S.reminders = S.reminders.filter(x => x.id !== id); save(); rerender(); break;
    // finance
    case 'sub-new': subModal(); break;
    case 'sub-edit': subModal(S.subs.find(s => s.id === id)); break;
    case 'sub-del': { const s = S.subs.find(x => x.id === id); if (s && confirm(`Eliminare l'abbonamento ${s.name}?`)){ S.subs = S.subs.filter(x => x.id !== id); save(); rerender(); } break; }
    case 'inc-del': { const i = S.incomes.find(x => x.id === id); if (!i) break; if (!confirm(`Eliminare l'entrata di ${EUR.format(i.amount)}?`)) break; if (i.auto && i.month){ (S.salary.skipped ||= []).push(i.month); } S.incomes = S.incomes.filter(x => x.id !== id); save(); rerender(); break; }
    // crm
    case 'client-new': clientModal(); break;
    case 'client-edit': clientModal(S.clients.find(c => c.id === id)); break;
    case 'client-del': { const c = S.clients.find(x => x.id === id); if (c && confirm(`Eliminare ${c.name} dalla pipeline?`)){ S.clients = S.clients.filter(x => x.id !== id); save(); rerender(); } break; }
    case 'rate': { const c = S.clients.find(x => x.id === id); if (c){ c.rating = (+c.rating === +v) ? 0 : +v; c.updated = todayKey(); save(); const card = el.closest('.client'); card ? (card.outerHTML = clientCard(c)) : rerender(); } break; }
    case 'strategy': { const c = S.clients.find(x => x.id === id); if (c) openModal({eyebrow:'Consigli di trattativa', title:c.name, body:strategyHTML(c), wide:true}); break; }
    case 'crm-filter': S.ui.crmFilter = v; save(); rerender(); break;
    // stats
    case 'stats-days': S.ui.statsDays = +v; save(); rerender(); break;
    // settings
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `quartier-generale-backup-${todayKey()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Backup esportato.', {tone:'em', icon:'download'}); break;
    }
    case 'reset': {
      const w = prompt('Per confermare scrivi AZZERA'); if (w === 'AZZERA'){ S = defaults(); S.ui.theme = currentTheme(); S.ui.layout = currentLayout(); viewDay = todayKey(); save(); closeModal(); rerender(); toast('Dati azzerati. Si riparte.', {tone:'em'}); }
      break;
    }
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-act="stage"]')){ const c = S.clients.find(x => x.id === el.dataset.id); if (c){ setStage(c, el.value); rerender(); } }
  else if (el.matches('[data-act="learn-sector-select"]')){ const w = $('#learnCustomWrap'); if (w){ w.hidden = el.value !== 'altro:__new'; if (!w.hidden) $('#learnCustom').focus(); } }
  else if (el.matches('[data-act="crm-sort"]')){ S.ui.crmSort = el.value; save(); rerender(); }
  else if (el.matches('[data-act="home-select"]') && el.value){ prevScore = score(viewDay); const a = getDay(viewDay, true).home.acts; if (!a.includes(el.value)) a.push(el.value); afterHabitChange('home'); }
  else if (el.matches('[data-act="import"]')){
    const f = el.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const data = JSON.parse(r.result); if (!data || typeof data !== 'object' || !data.days || !Array.isArray(data.subs)) throw new Error('formato'); if (!confirm('Importare il backup? I dati attuali verranno sostituiti.')) return; localStorage.setItem(KEY, JSON.stringify(data)); S = load(); applyTheme(S.ui.theme || currentTheme(), {silent:true}); applyLayout(S.ui.layout || currentLayout(), {silent:true}); closeModal(); rerender(); toast('Backup importato con successo.', {tone:'em'}); } catch(err){ toast('File non valido: non è un backup di Quartier Generale.', {tone:'ruby'}); } };
    r.readAsText(f);
  }
});
let qT = null;
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.field; if (!f) return;
  if (f === 'crm-q'){ crmQuery = el.value; clearTimeout(qT); qT = setTimeout(() => { const pos = el.selectionStart; rerender(); const n = $('[data-field="crm-q"]'); if (n){ n.focus(); n.setSelectionRange(pos,pos); } }, 220); return; }
  const d = getDay(viewDay, true);
  prevScore = score(viewDay);
  if (f === 'home-note'){ d.home.note = el.value; save(); return; }
  if (f === 'learnDraft'){ d.learnDraft = el.value; save(); return; }
  if (f === 'social'){ d.social = el.value === '' ? null : Math.max(0, Math.round(+el.value)); afterHabitChange('social', false); return; }
  if (f === 'sleep'){ d.sleep = el.value === '' ? null : clamp(+el.value, 0, 24); afterHabitChange('sleep', false); return; }
  if (f === 'water'){ const raw = el.value.trim().replace(',', '.'), n = parseFloat(raw); if (raw !== '' && !isFinite(n)) return; d.water = raw === '' ? null : clamp(+n.toFixed(2), 0, 15); afterHabitChange('water', false); paintWater(d.water); return; }
  if (f === 'bed' || f === 'wake'){
    d[f] = el.value; const h = sleepFromTimes(d.bed, d.wake);
    if (h !== null){ d.sleep = h; const inp = $('[data-field="sleep"]'); if (inp) inp.value = h; }
    afterHabitChange('sleep', false); return;
  }
  if (f === 'km'){ d.km = el.value === '' ? null : Math.max(0, +el.value); afterHabitChange('run', false); const w = $('[data-live="run-week"]'); if (w) w.textContent = N1.format(sum(range(addDays(viewDay,-6), viewDay).map(x => +(S.days[x]?.km)||0))) + ' km'; return; }
});
document.addEventListener('submit', e => {
  const form = e.target, type = form.dataset.form; if (!type) return;
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(form).entries());
  switch(type){
    case 'rem': S.reminders.push({id:uid(), text:fd.text.trim(), date:fd.date||'', done:false}); save(); rerender(); break;
    case 'film': { prevScore = score(viewDay); const t = fd.title.trim(); if (!t) return; getDay(viewDay, true).films.push({title:t, note:(fd.note||'').trim()}); afterHabitChange('cinema'); renderTracker(); toast(`“${esc(t)}” aggiunto. Finestra film coperta per 3 giorni.`, {tone:'em', icon:'film'}); break; }
    case 'salary': { const amt = Math.max(0, +fd.amount||0); const first = !(+S.salary.amount > 0); S.salary.amount = amt; if (first) S.salary.since = todayKey().slice(0,7); save(); const n = syncSalary(); toast(amt ? `Stipendio impostato: ${EUR.format(amt)}/mese.${n?' Accredito del mese registrato.':''}` : 'Stipendio disattivato.', {tone:'em'}); rerender(); break; }
    case 'income': { const amt = +fd.amount; if (!(amt > 0)) return toast('Inserisci un importo valido.', {tone:'ruby'}); const c = S.clients.find(x => x.name.toLowerCase() === fd.label.trim().toLowerCase()); S.incomes.push({id:uid(), type:fd.type, amount:amt, date:fd.date, label:fd.label.trim(), note:(fd.note||'').trim(), clientId:c?.id}); save(); toast(`Entrata registrata: +${EUR.format(amt)}`, {tone:'em', icon:'euro'}); rerender(); break; }
    case 'sub': {
      const id = form.dataset.id, data = {name:fd.name.trim(), price:+fd.price, period:fd.period, renewal:fd.renewal, auto:fd.auto==='1', anchor:+fd.renewal.slice(8,10), color:fd.color};
      if (id){ Object.assign(S.subs.find(s => s.id === id), data); } else S.subs.push({id:uid(), since:todayKey(), ...data});
      rollSubs(); save(); closeModal(); rerender(); toast('Abbonamento salvato.', {tone:'em'}); break;
    }
    case 'client': {
      const id = form.dataset.id, t = todayKey();
      const data = {name:fd.name.trim(), contact:fd.contact.trim(), phone:fd.phone.trim(), zone:fd.zone.trim(), sector:fd.sector, appt:fd.appt, rating:+fd.rating||0, price:fd.price===''?'':Math.max(0,+fd.price), notes:fd.notes.trim(), updated:t};
      if (id){ const c = S.clients.find(x => x.id === id); const st = fd.stage; Object.assign(c, data); if (c.stage !== st) setStage(c, st); }
      else { const c = {id:uid(), created:t, stage:'da_contattare', ...data}; S.clients.push(c); if (fd.stage !== 'da_contattare') setStage(c, fd.stage); toast(`${esc(c.name)} aggiunto alla pipeline.`, {tone:'em', icon:'briefcase'}); }
      save(); closeModal(); rerender(); break;
    }
    case 'learn-sector': confirmManualLearn(form, fd); break;
    case 'profile': S.profile.name = fd.name.trim(); save(); closeModal(); rerender(); toast('Profilo aggiornato.', {tone:'em'}); break;
  }
});

function haptic(){ try { if (navigator.vibrate && matchMedia('(pointer:coarse)').matches) navigator.vibrate(6); } catch(e){} }
document.addEventListener('touchstart', () => {}, {passive:true}); // attiva gli stati :active su iOS
(() => {
  if (!matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  let raf = 0, last = null;
  document.addEventListener('pointermove', e => {
    last = e; if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; const c = last.target.closest && last.target.closest('.card'); if (!c) return; const r = c.getBoundingClientRect(); c.style.setProperty('--mx', `${last.clientX - r.left}px`); c.style.setProperty('--my', `${last.clientY - r.top}px`); });
  }, {passive:true});
})();
(() => {
  const tb = $('.topbar'); let on = false;
  const f = () => { const y = window.scrollY, room = document.documentElement.scrollHeight - innerHeight > 180; const v = room && (on ? y > 8 : y > 44); if (v !== on){ on = v; tb.classList.toggle('stuck', v); } };
  window.addEventListener('scroll', f, {passive:true}); f();
})();

/* =========================================================
   LIVE TICK
   ========================================================= */
let lastMinute = -1, lastDayKey_ = todayKey();
setInterval(() => {
  const now = new Date();
  $('#clock').textContent = now.toLocaleTimeString('it-IT',{hour:'2-digit', minute:'2-digit'});
  if (todayKey() !== lastDayKey_){ // mezzanotte: aggiorna tutto
    if (viewDay === lastDayKey_) viewDay = todayKey();
    lastDayKey_ = todayKey(); rollSubs(); syncSalary(); rerender(); return;
  }
  if (S.timer){
    const s = studySecs(S.timer.day), txt = fmtClock(s);
    $$('[data-live="chip"],[data-live="hero"]').forEach(x => x.textContent = txt);
    if (route === 'tracker' && viewDay === S.timer.day){ const tm = $('[data-live="timer"]'); if (tm) tm.textContent = txt; if (now.getSeconds() % 5 === 0) refreshChrome('study'); }
    $$('[data-live="study-mini"]').forEach(x => x.textContent = `${fmtDur(s)} / 2h`);
    $$('[data-live="focus-timer"]').forEach(x => x.textContent = txt);
    $$('[data-live="focus-bar"]').forEach(x => x.style.width = Math.min(100, s/STUDY_GOAL*100) + '%');
    if (route === 'home' && now.getSeconds() % 10 === 0) scLive();
    if (s >= STUDY_GOAL && s - 1.05 < STUDY_GOAL){ toast('Obiettivo studio raggiunto: 2 ore di focus. Rispetto.', {tone:'em', icon:'crown', ms:6000}); if (route === 'tracker') replaceCard('study'); else if (route === 'home') rerender(); }
  }
  if (now.getMinutes() !== lastMinute){ lastMinute = now.getMinutes(); }
}, 1000);

/* =========================================================
   BOOT
   ========================================================= */
applyTheme(S.ui.theme || currentTheme(), {silent:true});
applyLayout(S.ui.layout || currentLayout(), {silent:true});
rollSubs();
const addedSalary = syncSalary();
save();
go();
$('#clock').textContent = new Date().toLocaleTimeString('it-IT',{hour:'2-digit', minute:'2-digit'});
hydrateIcons();
refreshInstallUI();
if (document.readyState === 'complete') registerSW(); else window.addEventListener('load', registerSW);
if (addedSalary) setTimeout(() => toast(`Stipendio registrato automaticamente (${plural(addedSalary,'mese','mesi')}).`, {tone:'em', icon:'euro'}), 600);
window.QG = {get state(){ return S; }, set state(v){ S = v; save(); rerender(); }};
})();
